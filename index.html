<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#194f3e" />
  <title>اكتشف أجزاء النبتة</title>
  <link rel="stylesheet" href="style.css?v=20260917j" />
</head>
<body>
  <main id="app">
    <section id="coverScreen" class="screen active image-screen">
      <img src="cover.jpg" alt="ابدأ الاكتشاف" class="screen-image" />
      <button id="coverStartBtn" class="hotspot hs-cover" aria-label="ابدأ الاكتشاف"></button>
    </section>

    <section id="videoScreen" class="screen center-screen">
      <video id="introVideo" class="fullscreen-video" playsinline preload="metadata" controlslist="nodownload noplaybackrate" disablepictureinpicture>
        <source src="intro.mp4" type="video/mp4" />
      </video>
      <button id="playIntroBtn" class="main-btn">تشغيل الفيديو</button>
      <button id="goGrowthBtn" class="main-btn hidden">التالي</button>
    </section>

    <section id="growthScreen" class="screen center-screen">
      <video id="growthVideo" class="fullscreen-video" playsinline preload="metadata" controlslist="nodownload noplaybackrate" disablepictureinpicture>
        <source src="growth.mp4" type="video/mp4" />
      </video>
      <button id="playGrowthBtn" class="main-btn">شغّل رحلة النمو</button>
      <button id="showPartsBtn" class="main-btn hidden">ابدأ الاكتشاف</button>
    </section>

    <section id="partsScreen" class="screen image-screen mapped-screen">
      <img id="partsImage" src="parts.png" alt="أجزاء النبتة" class="screen-image mapped-image" />
      <button class="hotspot mapped-hotspot" data-part="roots" data-x="0.397" data-y="0.748" data-w="0.190" data-h="0.145" aria-label="الجذور"></button>
      <button class="hotspot mapped-hotspot" data-part="stem" data-x="0.745" data-y="0.455" data-w="0.190" data-h="0.155" aria-label="الساق"></button>
      <button class="hotspot mapped-hotspot" data-part="leaves" data-x="0.335" data-y="0.205" data-w="0.185" data-h="0.155" aria-label="الأوراق"></button>
      <button class="hotspot mapped-hotspot" data-part="flower" data-x="0.755" data-y="0.025" data-w="0.185" data-h="0.145" aria-label="الزهرة"></button>
      <button class="hotspot mapped-hotspot" data-part="fruit" data-x="0.805" data-y="0.235" data-w="0.180" data-h="0.165" aria-label="الثمرة"></button>
      <button id="likeBtn" class="like-btn" aria-label="إعجاب"><span>❤</span><b id="likeCount">0</b></button>
    </section>

    <section id="detailScreen" class="screen image-screen detail-screen">
      <img id="detailImage" src="roots.png" alt="شرح الجزء" class="screen-image" />
      <div class="detail-nav">
        <button id="detailBackBtn" class="secondary-btn">الرجوع للأجزاء</button>
        <button id="detailNextBtn" class="secondary-btn">التالي</button>
      </div>
    </section>

    <section id="challengeScreen" class="screen image-screen mapped-screen">
      <img id="challengeImage" src="challenge-page.png" alt="جاهزون للتحدي" class="screen-image mapped-image" />
      <button id="beginQuizBtn" class="hotspot mapped-hotspot" data-x="0.225" data-y="0.670" data-w="0.540" data-h="0.210" aria-label="ابدأ التحدي"></button>
    </section>

    <section id="quizScreen" class="screen image-screen mapped-screen">
      <img id="quizImage" src="quiz-background-final.png?v=20260917j" alt="اختبر معلوماتك" class="screen-image mapped-image" />
      <div id="quizProgress" class="quiz-progress mapped-ui" data-x="0.715" data-y="0.145" data-w="0.105" data-h="0.060">1 / 10</div>
      <div id="timerClock" class="quiz-timer mapped-ui" data-x="0.875" data-y="0.115" data-w="0.070" data-h="0.110"><span id="timerNum">10</span></div>
      <div id="questionBox" class="question-box mapped-ui" data-x="0.265" data-y="0.265" data-w="0.540" data-h="0.120"><div id="questionText"></div></div>
      <div id="answers" class="answers-grid mapped-ui" data-x="0.365" data-y="0.410" data-w="0.330" data-h="0.430"></div>
      <div id="feedback" class="feedback mapped-ui" data-x="0.395" data-y="0.850" data-w="0.300" data-h="0.055"></div>
    </section>

    <section id="resultScreen" class="screen image-screen mapped-screen result-fit-screen">
      <img id="resultImage" src="result-page-final.png?v=20260917j" alt="أحسنت يا بطل" class="screen-image mapped-image result-fit-image" />
      <div id="celebrationLayer" class="celebration-layer" aria-hidden="true"></div>

      <div id="scoreText" class="score-number mapped-ui" data-x="0.402" data-y="0.349" data-w="0.185" data-h="0.123"></div>

      <a id="whatsappContactBtn" class="whatsapp-hotspot mapped-ui" data-x="0.495" data-y="0.588" data-w="0.151" data-h="0.082" href="https://wa.me/970598494977" target="_blank" rel="noopener" aria-label="تواصل معنا عبر واتساب"></a>

      <div id="ratingStars" class="hidden-rating" aria-hidden="true">
        <button data-rate="1"></button><button data-rate="2"></button><button data-rate="3"></button><button data-rate="4"></button><button data-rate="5"></button>
      </div>

      <textarea id="ideaInput" class="idea-input mapped-ui" data-x="0.289" data-y="0.748" data-w="0.229" data-h="0.063" rows="2" placeholder="اكتب فكرتك هنا"></textarea>
      <button id="sendIdeaBtn" class="transparent-action mapped-ui" data-x="0.520" data-y="0.748" data-w="0.121" data-h="0.063" aria-label="إرسال الفكرة"></button>

      <a class="transparent-action mapped-ui" data-x="0.672" data-y="0.596" data-w="0.046" data-h="0.105" href="https://www.instagram.com/ghada.invitations/" target="_blank" rel="noopener" aria-label="Instagram"></a>
      <a class="transparent-action mapped-ui" data-x="0.728" data-y="0.596" data-w="0.046" data-h="0.105" href="https://www.tiktok.com/@ghada.invitations" target="_blank" rel="noopener" aria-label="TikTok"></a>
      <a class="transparent-action mapped-ui" data-x="0.785" data-y="0.596" data-w="0.046" data-h="0.105" href="https://www.snapchat.com/add/ghada.invitations" target="_blank" rel="noopener" aria-label="Snapchat"></a>

      <button id="restartQuizBtn" class="transparent-action mapped-ui" data-x="0.371" data-y="0.847" data-w="0.166" data-h="0.089" aria-label="إعادة التحدي"></button>
      <button id="returnPartsBtn" class="transparent-action mapped-ui" data-x="0.552" data-y="0.847" data-w="0.174" data-h="0.089" aria-label="الرجوع للأجزاء"></button>
      <div id="statusToast" class="status-toast"></div>
    </section>
  </main>
  <script src="script.js?v=20260917j"></script>
</body>
</html>
