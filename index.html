<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#79c8f2" />
  <title>هيا نكتشف أجزاء النبتة</title>
  <link rel="stylesheet" href="style.css?v=20260916a" />
</head>
<body>
  <main id="app" class="app">

    <section id="coverScreen" class="screen active" aria-label="بداية التجربة">
      <div class="stage cover-stage">
        <img class="stage-media" src="cover.jpg" alt="مقدمة درس أجزاء النبتة" />
        <button id="potStartBtn" class="pot-start-visible" type="button" aria-label="ابدأ الآن">ابدأ الآن</button>
      </div>
    </section>

    <section id="videoScreen" class="screen" aria-label="الفيديو التعريفي">
      <div class="video-stage">
        <video id="introVideo" class="full-video" playsinline preload="auto" controlslist="nodownload noplaybackrate" disablepictureinpicture>
          <source src="intro.mp4" type="video/mp4" />
        </video>
        <button id="manualPlayBtn" class="manual-play hidden" type="button">اضغط لتشغيل الفيديو</button>
      </div>
    </section>

    <section id="growthScreen" class="screen" aria-label="مراحل نمو النبتة">
      <div class="video-stage growth-stage">
        <video id="growthVideo" class="full-video" playsinline preload="auto" controlslist="nodownload noplaybackrate" disablepictureinpicture>
          <source src="growth.mp4" type="video/mp4" />
        </video>
        <button id="growthPlayBtn" class="manual-play hidden" type="button">اضغط لتشغيل فيديو النمو</button>
        <button id="discoverBtn" class="discover-btn hidden" type="button">ابدأ الاكتشاف 🌱</button>
      </div>
    </section>

    <section id="partsScreen" class="screen" aria-label="أجزاء النبتة">
      <div class="stage parts-stage">
        <img class="stage-media" src="parts.png" alt="أجزاء النبتة" />
        <button class="hotspot part-hotspot flower" data-part="flower" type="button" aria-label="الزهرة"></button>
        <button class="hotspot part-hotspot fruit" data-part="fruit" type="button" aria-label="الثمرة"></button>
        <button class="hotspot part-hotspot leaves" data-part="leaves" type="button" aria-label="الأوراق"></button>
        <button class="hotspot part-hotspot stem" data-part="stem" type="button" aria-label="الساق"></button>
        <button class="hotspot part-hotspot roots" data-part="roots" type="button" aria-label="الجذور"></button>
        <button id="quizFromPartsBtn" class="quiz-entry-btn" type="button">🏆 اختبر معلوماتك</button>
      </div>
    </section>

    <section id="detailScreen" class="screen" aria-label="شرح الجزء">
      <div class="stage detail-stage">
        <img id="detailImage" class="stage-media" src="seed.png" alt="شرح الجزء المختار" />
        <div class="detail-overlay">
          <button id="backBtn" class="back-btn" type="button">رجوع للأجزاء</button>
          <div class="narration-card" aria-live="polite"><strong>محمد يشرح:</strong><span id="narrationText"></span></div>
          <button id="nextBtn" class="next-btn" type="button">الجزء التالي ←</button>
        </div>
      </div>
    </section>

    <section id="quizScreen" class="screen quiz-screen" aria-label="تحدي الأسئلة">
      <div class="quiz-bg"></div>
      <div class="quiz-shell">
        <div class="quiz-topbar">
          <div id="quizProgress" class="quiz-progress">سؤال 1 من 6</div>
          <div id="timer" class="timer" aria-label="10 ثواني"><span id="timerNumber">10</span></div>
        </div>
        <div class="quiz-card">
          <div class="quiz-badge">🌱 تحدي الباحث الصغير</div>
          <h1 id="questionText" class="question-text"></h1>
          <div id="answers" class="answers"></div>
          <div id="feedback" class="feedback" aria-live="polite"></div>
          <button id="nextQuestionBtn" class="next-question hidden" type="button">السؤال التالي</button>
        </div>
      </div>
    </section>

    <section id="resultScreen" class="screen result-screen" aria-label="النتيجة والتقييم">
      <div class="result-card">
        <div class="result-star">🏆</div>
        <h1>أحسنت!</h1>
        <p id="scoreText"></p>

        <div class="rating-box">
          <h2>قديش حبيت التجربة؟</h2>
          <div id="ratingStars" class="rating-stars" role="group" aria-label="التقييم من خمس نجوم">
            <button type="button" data-rating="1" aria-label="نجمة واحدة">★</button>
            <button type="button" data-rating="2" aria-label="نجمتان">★</button>
            <button type="button" data-rating="3" aria-label="ثلاث نجوم">★</button>
            <button type="button" data-rating="4" aria-label="أربع نجوم">★</button>
            <button type="button" data-rating="5" aria-label="خمس نجوم">★</button>
          </div>
          <button id="submitRatingBtn" class="submit-rating-btn" type="button">إرسال التقييم</button>
          <div id="ratingStatus" class="rating-status" aria-live="polite"></div>
        </div>

        <div class="social-box">
          <div class="social-label">تابعونا للمزيد 🌱</div>
          <div class="social-icons">
            <a href="https://www.instagram.com/ghada.invitations/" target="_blank" rel="noopener noreferrer" aria-label="Instagram" class="social-icon">
              <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="5"></rect><circle cx="12" cy="12" r="4"></circle><circle cx="17.4" cy="6.6" r="1.1" class="fill-dot"></circle></svg>
            </a>
            <a href="https://www.tiktok.com/@ghada.invitations" target="_blank" rel="noopener noreferrer" aria-label="TikTok" class="social-icon">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14 4v9.2a4.2 4.2 0 1 1-3-4V12a1.7 1.7 0 1 0 1 1.55V4h2Zm0 0c.5 2.2 1.8 3.6 4 4.2v2.7c-1.6-.2-2.9-.8-4-1.7"></path></svg>
            </a>
          </div>
        </div>

        <div class="result-actions">
          <button id="restartQuizBtn" type="button">أعد التحدي</button>
          <button id="returnPartsBtn" type="button">🌿 العودة إلى أجزاء النبتة</button>
        </div>
      </div>
    </section>

  </main>
  <script src="script.js?v=20260916a"></script>
</body>
</html>
