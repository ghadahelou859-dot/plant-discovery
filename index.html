<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#194f3e" />
  <title>اكتشف أجزاء النبتة</title>
  <link rel="stylesheet" href="style.css?v=20260917d" />
</head>
<body>
  <main id="app">
    <section id="coverScreen" class="screen active image-screen">
      <img src="cover.jpg" alt="ابدأ الاكتشاف" class="screen-image" />
      <button id="coverStartBtn" class="hotspot hs-cover" aria-label="ابدأ الاكتشاف"></button>
    </section>

    <section id="videoScreen" class="screen center-screen">
      <video id="introVideo" class="fullscreen-video" playsinline preload="metadata" controlslist="nodownload noplaybackrate" disablepictureinpicture>
        <source src="intro.mp4" type="video/mp4" />
      </video>
      <button id="playIntroBtn" class="main-btn">تشغيل الفيديو</button>
      <button id="goGrowthBtn" class="main-btn hidden">التالي</button>
    </section>

    <section id="growthScreen" class="screen center-screen">
      <video id="growthVideo" class="fullscreen-video" playsinline preload="metadata" controlslist="nodownload noplaybackrate" disablepictureinpicture>
        <source src="growth.mp4" type="video/mp4" />
      </video>
      <button id="playGrowthBtn" class="main-btn">شغّل رحلة النمو</button>
      <button id="showPartsBtn" class="main-btn hidden">ابدأ الاكتشاف</button>
    </section>

    <section id="partsScreen" class="screen image-screen mapped-screen">
      <img id="partsImage" src="parts.png" alt="أجزاء النبتة" class="screen-image mapped-image" />
      <button class="hotspot mapped-hotspot" data-part="roots" data-x="0.397" data-y="0.748" data-w="0.190" data-h="0.145" aria-label="الجذور"></button>
      <button class="hotspot mapped-hotspot" data-part="stem" data-x="0.745" data-y="0.455" data-w="0.190" data-h="0.155" aria-label="الساق"></button>
      <button class="hotspot mapped-hotspot" data-part="leaves" data-x="0.335" data-y="0.205" data-w="0.185" data-h="0.155" aria-label="الأوراق"></button>
      <button class="hotspot mapped-hotspot" data-part="flower" data-x="0.755" data-y="0.025" data-w="0.185" data-h="0.145" aria-label="الزهرة"></button>
      <button class="hotspot mapped-hotspot" data-part="fruit" data-x="0.805" data-y="0.235" data-w="0.180" data-h="0.165" aria-label="الثمرة"></button>
      <button id="likeBtn" class="like-btn" aria-label="إعجاب"><span>❤</span><b id="likeCount">0</b></button>
    </section>

    <section id="detailScreen" class="screen image-screen detail-screen">
      <img id="detailImage" src="roots.png" alt="شرح الجزء" class="screen-image" />
      <div class="detail-nav">
        <button id="detailBackBtn" class="secondary-btn">الرجوع للأجزاء</button>
        <button id="detailNextBtn" class="secondary-btn">التالي</button>
      </div>
    </section>

    <section id="challengeScreen" class="screen image-screen mapped-screen">
      <img id="challengeImage" src="challenge-page.png" alt="جاهزون للتحدي" class="screen-image mapped-image" />
      <button id="beginQuizBtn" class="hotspot mapped-hotspot" data-x="0.385" data-y="0.545" data-w="0.410" data-h="0.235" aria-label="ابدأ التحدي"></button>
    </section>

    <section id="quizScreen" class="screen image-screen mapped-screen contain-screen">
      <img id="quizImage" src="quiz-background-final.png" alt="اختبر معلوماتك" class="screen-image mapped-image contain-image" />
      <div id="quizProgress" class="quiz-progress mapped-ui" data-x="0.715" data-y="0.105" data-w="0.120" data-h="0.085">1 / 10</div>
      <div id="timerClock" class="quiz-timer mapped-ui" data-x="0.855" data-y="0.060" data-w="0.105" data-h="0.185"><span id="timerNum">10</span></div>
      <div id="questionBox" class="question-box mapped-ui" data-x="0.270" data-y="0.255" data-w="0.535" data-h="0.135"><div id="questionText"></div></div>
      <div id="answers" class="answers-grid mapped-ui" data-x="0.365" data-y="0.405" data-w="0.330" data-h="0.445"></div>
      <div id="feedback" class="feedback mapped-ui" data-x="0.395" data-y="0.855" data-w="0.300" data-h="0.055"></div>
    </section>

    <section id="resultScreen" class="screen image-screen mapped-screen contain-screen">
      <img id="resultImage" src="result-page-final.png" alt="أحسنت يا بطل" class="screen-image mapped-image contain-image" />
      <div id="celebrationLayer" class="celebration-layer" aria-hidden="true"></div>
      <div id="scoreText" class="score-number mapped-ui" data-x="0.665" data-y="0.265" data-w="0.105" data-h="0.080"></div>
      <div id="ratingStars" class="rating-hotspots mapped-ui" data-x="0.445" data-y="0.445" data-w="0.305" data-h="0.070">
        <button data-rate="1" aria-label="نجمة واحدة"></button><button data-rate="2" aria-label="نجمتان"></button><button data-rate="3" aria-label="3 نجوم"></button><button data-rate="4" aria-label="4 نجوم"></button><button data-rate="5" aria-label="5 نجوم"></button>
      </div>
      <textarea id="ideaInput" class="idea-input mapped-ui" data-x="0.410" data-y="0.590" data-w="0.400" data-h="0.060" rows="2" placeholder="اكتب فكرتك هنا"></textarea>
      <button id="sendIdeaBtn" class="transparent-action mapped-ui" data-x="0.410" data-y="0.650" data-w="0.400" data-h="0.050" aria-label="إرسال الفكرة"></button>
      <a class="transparent-action mapped-ui" data-x="0.415" data-y="0.750" data-w="0.065" data-h="0.060" href="https://www.instagram.com/ghada.invitations/" target="_blank" rel="noopener" aria-label="Instagram"></a>
      <a class="transparent-action mapped-ui" data-x="0.495" data-y="0.750" data-w="0.065" data-h="0.060" href="https://www.tiktok.com/@ghada.invitations" target="_blank" rel="noopener" aria-label="TikTok"></a>
      <a class="transparent-action mapped-ui" data-x="0.575" data-y="0.750" data-w="0.065" data-h="0.060" href="https://www.snapchat.com/add/ghada.invitations" target="_blank" rel="noopener" aria-label="Snapchat"></a>
      <button id="restartQuizBtn" class="transparent-action mapped-ui" data-x="0.315" data-y="0.855" data-w="0.235" data-h="0.075" aria-label="إعادة التحدي"></button>
      <button id="returnPartsBtn" class="transparent-action mapped-ui" data-x="0.570" data-y="0.855" data-w="0.265" data-h="0.075" aria-label="الرجوع للأجزاء"></button>
      <div id="statusToast" class="status-toast"></div>
    </section>
  </main>
  <script src="script.js?v=20260917d"></script>
</body>
</html>
