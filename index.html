<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#174f3e" />
  <title>هيا نكتشف أجزاء النبتة</title>
  <link rel="stylesheet" href="style.css?v=20260917a" />
</head>
<body>
  <button id="likeBtn" class="like-button" type="button" aria-label="أعجبني">
    <span class="like-heart">♥</span><span id="likeCount">0</span>
  </button>

  <main id="app" class="app">
    <section id="coverScreen" class="screen active" aria-label="بداية التجربة">
      <div class="stage cover-stage">
        <img class="stage-media" src="cover.jpg" alt="مقدمة درس أجزاء النبتة" />
        <button id="potStartBtn" class="cover-discover-hotspot" type="button" aria-label="ابدأ الاكتشاف"><span class="sr-only">ابدأ الاكتشاف</span></button>
      </div>
    </section>

    <section id="videoScreen" class="screen" aria-label="الفيديو التعريفي">
      <div class="video-stage">
        <video id="introVideo" class="full-video" playsinline preload="auto" controlslist="nodownload noplaybackrate" disablepictureinpicture><source src="intro.mp4" type="video/mp4" /></video>
        <button id="manualPlayBtn" class="manual-play hidden" type="button">اضغط لتشغيل الفيديو</button>
      </div>
    </section>

    <section id="growthScreen" class="screen" aria-label="مراحل نمو النبتة">
      <div class="video-stage growth-stage">
        <video id="growthVideo" class="full-video" playsinline preload="auto" controlslist="nodownload noplaybackrate" disablepictureinpicture><source src="growth.mp4" type="video/mp4" /></video>
        <button id="growthPlayBtn" class="manual-play hidden" type="button">اضغط لتشغيل فيديو النمو</button>
        <button id="discoverBtn" class="discover-btn hidden" type="button">ابدأ الاكتشاف 🌱</button>
      </div>
    </section>

    <section id="partsScreen" class="screen parts-screen" aria-label="أجزاء النبتة">
      <div class="parts-layout"><div class="parts-canvas">
        <img class="parts-image" src="parts.png" alt="أجزاء النبتة" />
        <button class="hotspot part-hotspot flower" data-part="flower" type="button" aria-label="الزهرة"></button>
        <button class="hotspot part-hotspot fruit" data-part="fruit" type="button" aria-label="الثمرة"></button>
        <button class="hotspot part-hotspot leaves" data-part="leaves" type="button" aria-label="الأوراق"></button>
        <button class="hotspot part-hotspot stem" data-part="stem" type="button" aria-label="الساق"></button>
        <button class="hotspot part-hotspot roots" data-part="roots" type="button" aria-label="الجذور"></button>
      </div></div>
    </section>

    <section id="detailScreen" class="screen" aria-label="شرح الجزء">
      <div class="stage detail-stage">
        <img id="detailImage" class="detail-image" src="seed.png" alt="شرح الجزء المختار" />
        <div class="detail-overlay"><button id="backBtn" class="back-btn" type="button">رجوع للأجزاء</button><button id="nextBtn" class="next-btn" type="button">الجزء التالي ←</button></div>
      </div>
    </section>

    <section id="challengeScreen" class="screen challenge-screen" aria-label="جاهزين للتحدي">
      <div class="art-stage challenge-art-stage">
        <img src="challenge-page.png" alt="جاهزين للتحدي" class="art-image" />
        <button id="beginChallengeBtn" class="art-hotspot challenge-start-hotspot" type="button" aria-label="ابدأ التحدي"><span class="sr-only">ابدأ التحدي</span></button>
      </div>
    </section>

    <section id="quizScreen" class="screen quiz-screen" aria-label="تحدي الأسئلة">
      <div class="quiz-background"></div>
      <div class="quiz-overlay">
        <div class="quiz-topbar"><div id="quizProgress" class="quiz-progress">السؤال 1 من 10</div><div id="timer" class="timer" aria-label="المؤقت"><span id="timerNumber">10</span><small>ثانية</small></div></div>
        <div class="quiz-card">
          <h1 id="questionText" class="question-text"></h1>
          <div id="answers" class="answers"></div>
          <div id="feedback" class="feedback" aria-live="polite"></div>
          <button id="nextQuestionBtn" class="next-question hidden" type="button">السؤال التالي ←</button>
        </div>
      </div>
    </section>

    <section id="resultScreen" class="screen result-screen" aria-label="النتيجة والتقييم">
      <div class="result-art-wrap">
        <div class="art-stage result-art-stage">
          <img src="result-page.png" alt="أحسنت يا بطل" class="art-image" />
          <div id="scoreText" class="score-overlay"></div>
          <button id="restartQuizBtn" class="art-hotspot result-restart-hotspot" type="button" aria-label="اكتشف من جديد"><span class="sr-only">اكتشف من جديد</span></button>
          <button id="returnPartsBtn" class="art-hotspot result-parts-hotspot" type="button" aria-label="العودة للأجزاء"><span class="sr-only">العودة للأجزاء</span></button>
        </div>
      </div>
      <section class="result-interactions" aria-label="التقييم والأفكار">
        <div class="rating-box"><h2>قيّم التجربة</h2><div class="rating-stars" role="group" aria-label="التقييم من خمس نجوم"><button type="button" data-rating="1">★</button><button type="button" data-rating="2">★</button><button type="button" data-rating="3">★</button><button type="button" data-rating="4">★</button><button type="button" data-rating="5">★</button></div><div id="ratingStatus" class="rating-status" aria-live="polite">اختاروا عدد النجوم وسيتم الحفظ تلقائيًا.</div></div>
        <div class="idea-box"><h2>شاركنا أفكارك 🌱</h2><textarea id="ideaText" rows="3" maxlength="500" placeholder="اكتب فكرة أو ملاحظة جميلة..."></textarea><button id="submitIdeaBtn" class="submit-idea-btn" type="button">إرسال ✈️</button><div id="ideaStatus" class="idea-status" aria-live="polite"></div></div>
        <div class="social-icons"><a href="https://www.instagram.com/ghada.invitations/" target="_blank" rel="noopener noreferrer" aria-label="Instagram" class="social-icon instagram">◎</a><a href="https://www.tiktok.com/@ghada.invitations" target="_blank" rel="noopener noreferrer" aria-label="TikTok" class="social-icon tiktok">♪</a><a id="snapchatLink" href="https://www.snapchat.com/add/ghada.invitations" target="_blank" rel="noopener noreferrer" aria-label="Snapchat" class="social-icon snapchat">👻</a></div>
      </section>
    </section>
  </main>
  <script src="script.js?v=20260917a"></script>
</body>
</html>
