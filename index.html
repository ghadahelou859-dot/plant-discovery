<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#84a943" />
  <title>اكتشف أجزاء النبتة</title>
  <link rel="stylesheet" href="style.css?v=20260917c" />
</head>
<body>
  <main id="app">
    <section id="coverScreen" class="screen active image-screen">
      <img src="cover.jpg" alt="ابدأ الاكتشاف" class="screen-image" />
      <button id="coverStartBtn" class="hotspot hs-cover" aria-label="ابدأ الاكتشاف"></button>
    </section>

    <section id="videoScreen" class="screen center-screen">
      <video id="introVideo" class="fullscreen-video" playsinline preload="metadata" controlslist="nodownload noplaybackrate" disablepictureinpicture>
        <source src="intro.mp4" type="video/mp4" />
      </video>
      <button id="playIntroBtn" class="main-btn">تشغيل الفيديو</button>
      <button id="goGrowthBtn" class="main-btn hidden">التالي</button>
    </section>

    <section id="growthScreen" class="screen center-screen">
      <video id="growthVideo" class="fullscreen-video" playsinline preload="metadata" controlslist="nodownload noplaybackrate" disablepictureinpicture>
        <source src="growth.mp4" type="video/mp4" />
      </video>
      <button id="playGrowthBtn" class="main-btn">شغّل رحلة النمو</button>
      <button id="showPartsBtn" class="main-btn hidden">ابدأ الاكتشاف</button>
    </section>

    <section id="partsScreen" class="screen image-screen mapped-screen">
      <img id="partsImage" src="parts.png" alt="أجزاء النبتة" class="screen-image mapped-image" />
      <button class="hotspot mapped-hotspot" data-part="roots" data-x="0.397" data-y="0.748" data-w="0.190" data-h="0.145" aria-label="الجذور"></button>
      <button class="hotspot mapped-hotspot" data-part="stem" data-x="0.745" data-y="0.455" data-w="0.190" data-h="0.155" aria-label="الساق"></button>
      <button class="hotspot mapped-hotspot" data-part="leaves" data-x="0.335" data-y="0.205" data-w="0.185" data-h="0.155" aria-label="الأوراق"></button>
      <button class="hotspot mapped-hotspot" data-part="flower" data-x="0.755" data-y="0.025" data-w="0.185" data-h="0.145" aria-label="الزهرة"></button>
      <button class="hotspot mapped-hotspot" data-part="fruit" data-x="0.805" data-y="0.235" data-w="0.180" data-h="0.165" aria-label="الثمرة"></button>
      <button id="likeBtn" class="like-btn" aria-label="إعجاب"><span>❤</span><b id="likeCount">0</b></button>
    </section>

    <section id="detailScreen" class="screen image-screen detail-screen">
      <img id="detailImage" src="roots.png" alt="شرح الجزء" class="screen-image" />
      <div class="detail-nav">
        <button id="detailBackBtn" class="secondary-btn">الرجوع للأجزاء</button>
        <button id="detailNextBtn" class="secondary-btn">التالي</button>
      </div>
    </section>

    <section id="challengeScreen" class="screen image-screen mapped-screen">
      <img id="challengeImage" src="challenge-page.png" alt="جاهزون للتحدي" class="screen-image mapped-image" />
      <button id="beginQuizBtn" class="hotspot mapped-hotspot" data-x="0.385" data-y="0.545" data-w="0.410" data-h="0.235" aria-label="ابدأ التحدي"></button>
    </section>

    <section id="quizScreen" class="screen image-screen mapped-screen">
      <img id="quizImage" src="quiz-background-final.png" alt="اختبر معلوماتك" class="screen-image mapped-image" />
      <div id="quizProgress" class="quiz-progress mapped-ui" data-x="0.690" data-y="0.105" data-w="0.145" data-h="0.075">1 / 10</div>
      <div id="timerClock" class="quiz-timer mapped-ui" data-x="0.825" data-y="0.280" data-w="0.105" data-h="0.165"><span id="timerNum">10</span></div>
      <div id="questionBox" class="question-box mapped-ui" data-x="0.335" data-y="0.205" data-w="0.455" data-h="0.125"><div id="questionText"></div></div>
      <div id="answers" class="answers-grid mapped-ui" data-x="0.345" data-y="0.355" data-w="0.440" data-h="0.455"></div>
      <div id="feedback" class="feedback mapped-ui" data-x="0.410" data-y="0.815" data-w="0.310" data-h="0.065"></div>
    </section>

    <section id="resultScreen" class="screen image-screen">
      <img src="result-page-final.png" alt="أحسنت يا بطل" class="screen-image" />
      <div class="result-overlay">
        <div id="scoreText" class="score-text"></div>
        <div class="rating-box">
          <div class="stars" id="ratingStars">
            <button data-rate="1">★</button><button data-rate="2">★</button><button data-rate="3">★</button><button data-rate="4">★</button><button data-rate="5">★</button>
          </div>
          <div id="ratingMsg" class="small-msg"></div>
        </div>
        <div class="idea-box">
          <textarea id="ideaInput" rows="3" placeholder="اكتب فكرتك هنا"></textarea>
          <button id="sendIdeaBtn" class="secondary-btn">إرسال الفكرة</button>
          <div id="ideaMsg" class="small-msg"></div>
        </div>
        <div class="social-row">
          <a href="https://www.instagram.com/ghada.invitations/" target="_blank" rel="noopener" class="social-pill ig">IG</a>
          <a href="https://www.tiktok.com/@ghada.invitations" target="_blank" rel="noopener" class="social-pill tt">TT</a>
          <a href="https://www.snapchat.com/add/ghada.invitations" target="_blank" rel="noopener" class="social-pill sc">SC</a>
        </div>
        <div class="result-actions">
          <button id="restartQuizBtn" class="secondary-btn">أعد التحدي</button>
          <button id="returnPartsBtn" class="secondary-btn">العودة للأجزاء</button>
        </div>
      </div>
    </section>
  </main>
  <script src="script.js?v=20260917c"></script>
</body>
</html>
